server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: swiftdrop

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/swiftdrop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: DeliveryHikariPool

  data:
    redis:
      host: ${REDIS_HOST:192.168.111.128}
      port: 6379
      password: ${REDIS_PASSWORD:root}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ---------------- AI（Spring AI 1.0.0-M6，兼容 Boot 3.2.x）----------------
  ai:
    openai:
      # 必须通过环境变量注入，禁止提交到仓库
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          # 分析类任务要稳定，不要创造性
          temperature: 0.2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    root: info
    com.delivery: debug

# ---------------- 业务可调参数 ----------------
delivery:
  dispatch:
    # 骑手响应超时（秒）：超过即视为超时，触发下一位
    response-timeout-seconds: 15
    # 每轮最多推送的候选骑手数
    candidate-limit: 10
    # 最大派单轮次，超过转人工调度
    max-round: 3
    # 搜索半径阶梯（米）
    radius-steps: 1000,3000,5000
    # 超时扫描间隔（毫秒）
    timeout-scan-interval-ms: 5000
    # 是否开启自动派单（下单后自动触发调度）
    auto-dispatch-enabled: true
  location:
    # 位置上报最小间隔（毫秒），低于此间隔的重复上报丢弃（防抖）
    report-min-interval-ms: 2000
    # 批量落库间隔（毫秒）
    flush-interval-ms: 1000
    # 单批最大条数
    flush-batch-size: 500
  # ---------------- 登录鉴权（演示账号；生产应落库并用 BCrypt 加密密码）----------------
  auth:
    admin:
      id: 1
      username: ${ADMIN_USERNAME:admin}
      # 数字密码建议加引号，避免被 YAML 当作数值解析
      password: "${ADMIN_PASSWORD:123456}"
      name: 调度管理员
  # ---------------- AI 调度 Copilot ----------------
  # 默认关闭：没配 Key 的部署天然不会失败；开启需显式设置 AI_ENABLED=true。
  # 关闭时接口仍返回模板答案，前端不会报错。
  ai:
    enabled: ${AI_ENABLED:false}
    # 答案长度上限，超出截断到最后一个完整句
    max-answer-chars: 400
    # 工具调用次数上限：防止模型反复调同一工具导致请求挂死
    max-tool-calls: 6
    # 按「订单 + 轮次」缓存解释结果的秒数（当前版本未启用缓存，预留）
    cache-ttl-seconds: 3600
